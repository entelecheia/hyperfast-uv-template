---
name: template

# Root only (not part of the rendered project): render every template variant
# and run the generated project's gate on it.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "copier.yaml"
      - ".copier-template/**"
      - ".github/**"
      - "scripts/**"
      - "Makefile"

permissions:
  contents: read

concurrency:
  group: template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # copier clones this repository to render HEAD
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.2"
          enable-cache: true
          cache-python: true
      - run: make render-test
