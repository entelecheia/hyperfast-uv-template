---
name: deploy-docs

# Publish the site for released versions only.
on:
  workflow_dispatch:
  push:
    branches: [release]
    paths: ["README.md", "mkdocs.yaml", "docs/**", ".github/workflows/deploy-docs.yaml"]

permissions:
  contents: write

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release # a manual run from another branch still publishes the released docs
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.2"
          enable-cache: true
          cache-python: true
      - run: uv sync --locked --no-default-groups --group docs
      - run: uv run --no-sync mkdocs gh-deploy --force
