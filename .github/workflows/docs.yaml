---
name: docs

# Strict docs build on pull requests that can change the site. The site reads
# docs/, README.md (included in the index), and mkdocs.yaml.
on:
  workflow_dispatch:
  pull_request:
    paths: ["docs/**", "*.md", "mkdocs.yaml", "pyproject.toml", "uv.lock", ".github/workflows/docs.yaml"]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.2"
          enable-cache: true
          cache-python: true
      - run: uv sync --locked --no-default-groups --group docs
      - run: uv run --no-sync mkdocs build --strict
